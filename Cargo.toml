[package]
name = "trading-engine"
version = "0.1.0"
edition = "2021"
authors = ["Trading Engine Developers"]
description = "High-performance Rust trading engine with Python API"
readme = "README.md"

[lib]
name = "trading_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "trading-engine-cli"
path = "src/main.rs"

[dependencies]
pyo3 = { version = "0.22", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = ["python"]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
