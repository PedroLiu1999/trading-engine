[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "trading-engine"
version = "0.1.0"
description = "High-performance Rust trading engine with Python API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "maturin>=1.5.0",
    "pyarrow>=15.0.0",
    "matplotlib>=3.8.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "trading_engine._trading_engine"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pyarrow>=25.0.1",
    "matplotlib>=3.8.0",
]
